version: "3.9"

services:
  db:
    image: postgres:15
    container_name: receptor_db
    restart: always
    environment:
      POSTGRES_USER: receptor_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: receptor_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: